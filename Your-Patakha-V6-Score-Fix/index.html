<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#21272c">
  <title>आपका पटाखा — Your Patakha</title>
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@500,700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="stage" class="cover-mode" aria-label="Your Patakha, a Diwali firework-catching game">
    <div id="field" aria-hidden="true"></div>
    <div id="effects" aria-hidden="true"></div>
    <div id="hud" aria-live="off">
      <div class="stat"><span class="stat-label">POINTS</span><span id="score" class="stat-number">0000</span></div>
      <div class="stat"><span class="stat-label">TIME LEFT</span><span id="time" class="stat-number">45</span></div>
    </div>
    <div id="igniter" aria-hidden="true"></div>
    <section id="intro" class="screen" aria-label="Start game">
      <div id="start-controls">
        <div id="slide-track" tabindex="0" role="button" aria-label="Slide right to ignite and start playing">
          <span id="slide-label">SLIDE TO IGNITE</span>
          <span id="slide-thumb" aria-hidden="true"><svg class="sparkle" viewBox="0 0 24 24" width="23" height="23" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 2.2V21.8M2.2 12H21.8M5.07 5.07L18.93 18.93M18.93 5.07L5.07 18.93" stroke="currentColor" stroke-width="1.45" stroke-linecap="round"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg></span>
        </div>
      </div>
    </section>
    <div id="ignition-transition" aria-hidden="true"><img id="ignition-animation" alt="" width="418" height="339"></div>
    <div id="end-blast" aria-hidden="true"></div>
    <section id="gameover" class="screen" aria-label="Your Patakha result" aria-live="polite">
      <div id="poster-fit" class="poster-fit">
        <div id="result-art" aria-hidden="true"><img id="result-image" src="assets/result-phuljhari.png" alt=""></div>
        <strong id="final-score" class="poster-score">0</strong>
        <div class="poster-prefix" aria-hidden="true">YOU’RE A</div>
        <strong id="result-name" class="poster-name">PHULJHADI</strong>
        <p id="result-tagline" class="poster-tagline">Small spark, big energy!</p>
        <button id="home" class="poster-hotspot" type="button" aria-label="Return to the opening screen" title="Home"></button>
        <button id="again" class="poster-hotspot" type="button" aria-label="Play another round" title="Play again"></button>
      </div>
    </section>
    <!-- The soundtrack is independent of the intro, gameplay, and results. -->
    <audio id="background-music" src="assets/his-theme.mp3" loop preload="auto"></audio>
    <audio id="sound-match" src="assets/match-lighting.mp3" preload="auto"></audio>
    <audio id="sound-correct" src="assets/firecracker.mp3" preload="auto"></audio>
    <audio id="sound-bomb" src="assets/bomb-blast.mp3" preload="auto"></audio>
    <audio id="sound-result" src="assets/game-over.mp3" preload="auto"></audio>
    <button id="music-toggle" type="button" aria-label="Turn background music off" aria-pressed="true" title="Music on">
      <svg class="music-on-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
        <path d="M4 9v6h4l5 4V5L8 9H4Z" stroke="currentColor" stroke-width="1.65" stroke-linejoin="round"/>
        <path d="M16 8a6 6 0 0 1 0 8M18.5 5.5a9.5 9.5 0 0 1 0 13" stroke="currentColor" stroke-width="1.65" stroke-linecap="round"/>
      </svg>
      <svg class="music-off-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
        <path d="M4 9v6h4l5 4V5L8 9H4Z" stroke="currentColor" stroke-width="1.65" stroke-linejoin="round"/>
        <path d="M17 9 22 15M22 9l-5 6" stroke="currentColor" stroke-width="1.65" stroke-linecap="round"/>
      </svg>
    </button>
  </main>
  <script src="game.js"></script>
</body>
</html>
